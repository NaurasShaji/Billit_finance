name: billit
description: Billit retail management and point-of-sale app with billing, inventory, GST, reports, and backups.
publish_to: "none"
version: 0.2.1+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  hive_ce: ^2.23.2
  hive_ce_flutter: 2.3.4
  path_provider: ^2.1.3
  uuid: ^4.4.0
  intl: ^0.19.0
  window_manager: ^0.4.3
  file_picker: ^8.0.6
  excel_community: ^2.6.2
  pdf: ^3.11.3
  printing: ^5.14.2
  print_bluetooth_thermal: 1.1.6
  flutter_thermal_printer: ^1.2.1+1
  esc_pos_utils_plus: ^2.0.3
  image: ^4.1.7
  http: ^1.2.2
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  file_saver: ^0.6.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  permission_handler: ^11.3.0
  mobile_scanner: ^5.2.3
  share_plus: 10.0.1
  qr: ^3.0.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  hive_ce_generator: ^1.11.3
  flutter_launcher_icons: ^0.13.1

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/billit_icon.png"
  adaptive_icon_foreground: "assets/icon/billit_icon.png"
  adaptive_icon_background: "#e6f7f4"
  min_sdk_android: 21
  
  # Web configuration
  web:
    generate: true
    image_path: "assets/icon/billit_icon.png"
    background_color: "#e6f7f4"  # Billit brand colors
    theme_color: "#0f9f8f"       # Darker green
  
  # Windows icon is kept as a manually maintained ICO because some PNG-compressed
  # ICO output is rejected by the Windows resource compiler.
  windows:
    generate: false
  
  # macOS configuration
  macos:
    generate: true
    image_path: "assets/icon/billit_icon.png"


flutter:
  uses-material-design: true

# Assets configuration
  assets:
  - assets/icon/
