name: Hive CE Migration Validation

on:
  push:
    branches:
      - feature/finance-team-promotion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hive-ce-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate Hive CE adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format Dart sources
        run: dart format lib test

      - name: Commit lockfile and generated adapters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock lib test
          if git diff --cached --quiet; then
            echo "No lockfile, generated adapter, or formatting changes to commit."
          else
            git commit -m "Regenerate Hive CE lockfile and adapters"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android release
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: billit-hive-ce-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
