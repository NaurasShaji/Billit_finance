name: One-time Billit Android build

on:
  push:
    branches:
      - feature/finance-team-promotion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: billit-one-time-android-build
  cancel-in-progress: false

jobs:
  android-release:
    name: Generate icons, verify, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify Hive CE dependency graph
        run: |
          flutter pub deps --style=compact | tee /tmp/billit-dependencies.txt
          if grep -E '(^|[[:space:]])hive[[:space:]]+[0-9]' /tmp/billit-dependencies.txt; then
            echo "::error::Legacy hive package is still present in the dependency graph."
            exit 1
          fi

      - name: Commit resolved dependency lockfile
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.lock
            git commit -m "Update Hive CE dependency lockfile"
            git push
          fi

      - name: Regenerate Hive CE adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Commit regenerated Hive CE adapters
        run: |
          if ! git diff --quiet -- 'lib/models/*.g.dart'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/models/*.g.dart
            git commit -m "Regenerate Hive CE adapters"
            git push
          fi

      - name: Regenerate Billit launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart and Flutter code
        id: analyze
        continue-on-error: true
        run: flutter analyze

      - name: Run Flutter tests
        id: tests
        continue-on-error: true
        run: flutter test

      - name: Create temporary CI signing key
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -keystore legacy_debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Billit CI Build, OU=Temporary, O=Billit, L=Unknown, ST=Unknown, C=IN"

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: billit-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Report verification result
        if: always()
        run: |
          if [ "${{ steps.analyze.outcome }}" != "success" ] || [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::APK build may be available, but analysis and/or tests failed. Review the earlier step logs."
            exit 1
          fi
